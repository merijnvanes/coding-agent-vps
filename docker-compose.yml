# docker-compose.yml — sandbox container spec
#
# Runs under rootless Docker as user `dev` (the human SSH user).
# Mounts the per-CLI credential files (read-only) and the project working tree.
#
# OAuth refresh tokens (~/.claude, ~/.codex, ~/.gemini) live in named
# volumes that survive image refresh / container recreation — no re-login
# needed across `docker compose up -d --build`. The tmux session itself
# does NOT survive container recreation (tmux is an in-container process,
# not state on disk); re-attach with `docker exec -it sandbox tmux
# attach -t main` after rebuild.

services:
  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: coding-agent-vps/sandbox:latest
    container_name: sandbox
    hostname: sandbox
    restart: unless-stopped
    stdin_open: true
    tty: true

    # Memory cap — full story in scripts/cloud-init-tasks.sh step 1
    # and daemon/sandbox.slice.
    #
    # mem_limit bounds container RAM at 3 GB of the host's 3.7 GB,
    # leaving ~700 MB for sshd/dockerd/tailscaled. On breach, in-container
    # allocations get ENOMEM at the cgroup boundary — most language
    # runtimes (Python, Node.js) surface this as a language-level OOM
    # error and exit; the cgroup OOM killer reaps anything that doesn't
    # self-terminate as a backstop. Host stays responsive throughout.
    #
    # cgroup_parent places the container under daemon/sandbox.slice,
    # which enforces memory.swap.max=0 — denying the container any
    # swap allowance so the host's 2 GB swap stays reserved as the
    # host's own emergency reclaim. We need the slice because Docker's
    # `memswap_limit: 3g` is silently ignored on rootless Docker +
    # cgroup v2 (the field is set on HostConfig but never applied to
    # the cgroup). See daemon/sandbox.slice for the empirical story.
    mem_limit: 3g
    cgroup_parent: sandbox.slice

    # Host-loopback dev-server ports — reachable ONLY via SSH port forwarding
    # from the laptop:
    #     ssh -L 3000:127.0.0.1:3000 dev@coding-agent-vps
    #
    # The "127.0.0.1:" prefix on every line is load-bearing. Without it,
    # rootless Docker binds 0.0.0.0:PORT on the host; ufw's "allow in on
    # tailscale0" rule then lets any tailnet peer reach the port, defeating
    # the access model. The three ingress-deny layers (Hetzner FW, ufw,
    # Tailscale ACL) govern external NICs; loopback is exempt by design,
    # which is what makes SSH `-L` work. See docs/USAGE.md "Exposing a
    # sandbox dev server" for the recipe + verification.
    #
    # ⚠ DO NOT remove the "127.0.0.1:" prefix on any of these lines.
    ports:
      - "127.0.0.1:3000-3009:3000-3009"   # Next.js / Rails / Express / generic Node
      - "127.0.0.1:5170-5179:5170-5179"   # Vite
      - "127.0.0.1:8000-8089:8000-8089"   # Flutter web / Django / Python / webpack-dev-server

    volumes:
      # Sockets (ssh-agent) — read+write on the *socket inode*, no unlink
      - type: bind
        source: /var/lib/agent-vps/sockets
        target: /run/sockets
        read_only: false

      # Non-secret sandbox config (the tooling Infisical project ID for the
      # PATH shims) — bootstrap.sh writes sandbox-config.sh here, the sandbox
      # shells source it via /etc/profile.d/agent-env.sh on start. No cloud-
      # CLI tokens land here; those are fetched per-command by the shims.
      - type: bind
        source: /var/lib/agent-vps/agent-config/env
        target: /run/agent-env
        read_only: true

      # Project working tree (rw)
      - type: bind
        source: /srv/dev/projects
        target: /work
        read_only: false

      # Sandbox state — named volumes that survive `docker compose up -d
      # --build`. Only on-disk state persists; in-container processes
      # like tmux are killed and have to be re-attached after rebuild.
      - sandbox-state:/home/agent/.local/state/agent-state    # reserved; currently no writes
      - sandbox-state-claude:/home/agent/.claude              # Claude Code OAuth refresh token + project state
      - sandbox-state-codex:/home/agent/.codex                # Codex OAuth refresh token
      - sandbox-state-gemini:/home/agent/.gemini              # Gemini CLI OAuth refresh token

    environment:
      # ssh-agent socket path — points at the socat bridge, not the raw
      # ssh-agent socket. See daemon/ssh-agent-bridge.service for why.
      # Must match entrypoint.sh.
      SSH_AUTH_SOCK: /run/sockets/ssh-agent-bridge.sock

volumes:
  sandbox-state:
  sandbox-state-claude:
  sandbox-state-codex:
  sandbox-state-gemini:
